<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ticket icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9E1548"/>
      <stop offset="1" stop-color="#780B31"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7F4"/>
      <stop offset="1" stop-color="#F8E9E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#3A0418" flood-opacity="0.35"/>
    </filter>
    <path id="ticket" d="M -126 -95 H 126 A 24 24 0 0 1 150 -71 V -28 A 28 28 0 0 0 150 28 V 71 A 24 24 0 0 1 126 95 H -126 A 24 24 0 0 1 -150 71 V 28 A 28 28 0 0 0 -150 -28 V -71 A 24 24 0 0 1 -126 -95 Z"/>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- back ticket (translucent) -->
  <g transform="translate(240 240) rotate(-30)">
    <use href="#ticket" fill="#F4CDD5" fill-opacity="0.5"/>
  </g>

  <!-- front ticket -->
  <g transform="translate(278 262) rotate(-16)" filter="url(#shadow)">
    <use href="#ticket" fill="url(#front)"/>
    <g fill="#8A1038">
      <rect x="56" y="-82" width="12" height="30" rx="6"/>
      <rect x="56" y="-38" width="12" height="30" rx="6"/>
      <rect x="56" y="6" width="12" height="30" rx="6"/>
      <rect x="56" y="50" width="12" height="30" rx="6"/>
    </g>
  </g>
</svg>
